
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МИКЛАТ — Экспедиционная яхта</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #071728;
  color: #f0f6ff;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px 16px;
  text-align: center;
  background: #102b44;
  border-bottom: 1px solid #36536c;
}
h1 { margin: 0 0 8px; letter-spacing: 3px; }
header p { margin: 0; color: #bed2e3; }
main {
  max-width: 780px;
  margin: auto;
  padding: 18px 12px;
}
.intro {
  text-align: center;
  padding: 20px 8px;
}
.intro p { line-height: 1.6; color: #c6d8e8; }
button {
  border: 0;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
  cursor: pointer;
}
#board {
  background: #e6b65a;
  color: #172438;
  font-weight: bold;
  padding: 14px 25px;
}
#chatArea { display: none; }
.characters {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.character {
  flex: 1;
  background: #1c3a56;
  color: white;
}
.character.active {
  background: #e6b65a;
  color: #172438;
  font-weight: bold;
}
#chat {
  height: 52vh;
  min-height: 290px;
  overflow-y: auto;
  padding: 14px;
  background: #10263c;
  border: 1px solid #36536c;
  border-radius: 12px;
}
.message {
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.mine {
  background: #24577c;
  margin-left: 14%;
}
.theirs {
  background: #233d51;
  margin-right: 14%;
}
.name {
  font-weight: bold;
  margin-bottom: 5px;
  color: #f2c977;
}
.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
#message {
  flex: 1;
  min-width: 0;
  background: #fff;
  color: #142333;
  border: 0;
  border-radius: 10px;
  padding: 13px;
  font-size: 16px;
}
#send {
  background: #e6b65a;
  color: #142333;
  font-weight: bold;
}
#send:disabled { opacity: .5; }
#status {
  min-height: 24px;
  margin-top: 10px;
  color: #c6d8e8;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
  <h1>⚓ МИКЛАТ</h1>
  <p>Экспедиционная яхта • 48 метров • 4 палубы</p>
</header>
<main>
  <section class="intro" id="intro">
    <h2>Добро пожаловать на борт</h2>
    <p>
      Наше путешествие начинается в Ираклионе,
      на острове Крит. Здесь тебя ждут
      капитан Виктор Соколов, морской биолог
      Лея Мартен и историк Адриан Беллини.
    </p>
    <button id="board">Подняться на борт</button>
  </section>

  <section id="chatArea">
    <h2>Разговоры на борту</h2>
    <div class="characters">
      <button class="character active" data-id="viktor">
        ⚓ Виктор
      </button>
      <button class="character" data-id="lea">
        🐬 Лея
      </button>
      <button class="character" data-id="adrian">
        📜 Адриан
      </button>
    </div>
    <div id="chat" aria-live="polite"></div>
    <form class="controls" id="form">
      <input id="message"
        placeholder="Напиши сообщение..."
        maxlength="2000"
        autocomplete="off"
        required>
      <button id="send" type="submit">Отправить</button>
    </form>
    <div id="status"></div>
  </section>
</main>

<script>
const API = "https://miklat-server.onrender.com/api/chat";

const names = {
  viktor: "Виктор Соколов",
  lea: "Лея Мартен",
  adrian: "Адриан Беллини"
};

let selected = "viktor";
let busy = false;

const chat = document.getElementById("chat");
const messageInput = document.getElementById("message");
const sendButton = document.getElementById("send");
const status = document.getElementById("status");

function addMessage(name, text, mine = false) {
  const element = document.createElement("div");
  element.className = "message " + (mine ? "mine" : "theirs");

  const label = document.createElement("div");
  label.className = "name";
  label.textContent = name;

  const content = document.createElement("div");
  content.textContent = text;

  element.append(label, content);
  chat.appendChild(element);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("board").onclick = () => {
  document.getElementById("intro").style.display = "none";
  document.getElementById("chatArea").style.display = "block";
  addMessage("Миклат",
    "Добро пожаловать на борт! Выбери собеседника и напиши ему.");
};

document.querySelectorAll(".character").forEach(button => {
  button.onclick = () => {
    selected = button.dataset.id;
    document.querySelectorAll(".character").forEach(item => {
      item.classList.toggle("active", item === button);
    });
    status.textContent = "Собеседник: " + names[selected];
  };
});

document.getElementById("form").onsubmit = async event => {
  event.preventDefault();
  if (busy) return;

  const text = messageInput.value.trim();
  if (!text) return;

  const character = selected;
  addMessage("Ты", text, true);
  messageInput.value = "";

  busy = true;
  sendButton.disabled = true;
  status.textContent = names[character] + " отвечает...";

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        character: character,
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка сервера");
    }

    addMessage(names[character],
      data.answer || "Ответ пока пуст.");
    status.textContent = "";
  } catch (error) {
    addMessage("Миклат",
      "Не удалось получить ответ. " + error.message);
    status.textContent = "Проверь соединение с сервером.";
  } finally {
    busy = false;
    sendButton.disabled = false;
    messageInput.focus();
  }
};
</script>
</body>
</html>
